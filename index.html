<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小游戏合集 - 常温科技</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f1a;--card:#1a1a2e;--card-hover:#22223a;--text:#e0e0e0;--text-muted:#8888a0;--border:#2a2a40}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100vh;overflow-x:hidden;line-height:1.6}
#particle-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hero{position:relative;z-index:1;text-align:center;padding:80px 20px 50px}
.hero-icon{font-size:64px;display:block;margin-bottom:16px;animation:heroFloat 3s ease-in-out infinite}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:14px;letter-spacing:2px}
.hero .subtitle{font-size:clamp(0.95rem,2vw,1.15rem);color:var(--text-muted);max-width:500px;margin:0 auto;line-height:1.8}
.hero .stats-bar{display:flex;justify-content:center;gap:40px;margin-top:32px;flex-wrap:wrap}
.hero .stat{display:flex;flex-direction:column;align-items:center;gap:4px}
.hero .stat-num{font-size:1.8rem;font-weight:700;background:linear-gradient(135deg,#667eea,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero .stat-label{font-size:0.82rem;color:var(--text-muted);letter-spacing:1px}
.divider{width:80px;height:3px;background:linear-gradient(90deg,#667eea,#764ba2);margin:0 auto 40px;border-radius:2px}
.grid-container{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 24px 60px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media(max-width:900px){.grid-container{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid-container{grid-template-columns:1fr;gap:18px;padding:0 16px 40px}.hero{padding:50px 16px 36px}}
.game-card{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--text);border:1px solid var(--border);transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s cubic-bezier(.22,1,.36,1),border-color .3s;opacity:0;transform:translateY(40px);cursor:pointer}
.game-card.visible{opacity:1;transform:translateY(0);transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s cubic-bezier(.22,1,.36,1),border-color .3s,opacity .6s ease-out}
.game-card:hover{transform:translateY(-8px) scale(1.02);border-color:rgba(255,255,255,0.08);background:var(--card-hover)}
.card-accent{height:4px;width:100%;flex-shrink:0}.card-body{padding:22px 22px 18px;display:flex;flex-direction:column;flex:1}
.card-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}.card-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.card-info{flex:1;min-width:0}.card-name{font-size:1.05rem;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{display:flex;align-items:center;gap:10px}.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:0.72rem;font-weight:600;letter-spacing:0.5px;border:1px solid}
.badge-puzzle{background:rgba(103,126,234,0.12);color:#8b9ff0;border-color:rgba(103,126,234,0.25)}
.badge-action{background:rgba(244,67,54,0.12);color:#f07070;border-color:rgba(244,67,54,0.25)}
.badge-strategy{background:rgba(255,152,0,0.12);color:#ffb74d;border-color:rgba(255,152,0,0.25)}
.stars{display:flex;gap:2px;font-size:0.75rem}.star-filled{color:#ffd700}.star-empty{color:#3a3a50}
.card-desc{font-size:0.88rem;color:var(--text-muted);margin-bottom:16px;line-height:1.6}
.card-footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--border)}
.highscore{font-size:0.78rem;color:var(--text-muted);display:flex;align-items:center;gap:4px}.highscore-val{font-weight:700;color:var(--text)}
.play-hint{font-size:0.78rem;font-weight:600;display:flex;align-items:center;gap:4px;transition:gap .25s}.game-card:hover .play-hint{gap:8px}
.play-hint .arrow{display:inline-block;transition:transform .25s}.game-card:hover .play-hint .arrow{transform:translateX(3px)}
footer{position:relative;z-index:1;text-align:center;padding:32px 20px 40px;color:var(--text-muted);font-size:0.82rem;border-top:1px solid var(--border)}
footer .footer-links{display:flex;justify-content:center;gap:20px;margin-bottom:12px;font-size:0.78rem}footer .footer-links span{opacity:0.6}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#555}::selection{background:rgba(103,126,234,0.3)}
</style>
</head>
<body>
<canvas id="particle-canvas"></canvas>
<section class="hero">
  <span class="hero-icon" aria-hidden="true">🎮</span>
  <h1>🎮 小游戏合集</h1>
  <p class="subtitle">10款精品网页小游戏，即开即玩，零安装</p>
  <div class="stats-bar"><div class="stat"><span class="stat-num">10</span><span class="stat-label">精选游戏</span></div>
    <div class="stat"><span class="stat-num">3</span><span class="stat-label">游戏类型</span></div>
    <div class="stat"><span class="stat-num">0</span><span class="stat-label">需要安装</span></div></div>
</section>
<div class="divider"></div>
<div class="grid-container" id="game-grid"></div>
<footer>
  <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px">
    <img src="logo.png" alt="常温科技" style="width:32px;height:32px;border-radius:50%">
    <span style="font-size:1rem;font-weight:600;color:#ccc">常温科技</span>
  </div>
  <p style="margin-bottom:6px;color:#8888a0;font-size:0.85rem">让开发回归常温</p>
  <div class="footer-links"><span>HTML5 游戏</span><span>|</span><span>无需下载</span><span>|</span><span>即开即玩</span></div>
  <p style="margin-top:8px">© 2026 常温科技 · AI 驱动开发</p>
</footer>
<script>
var GAMES=[{name:"2048 数字华容道",type:"益智",stars:2,desc:"滑动合并，挑战最高数字",icon:"🔢",folder:"01-2048",color:"#edc22e",id:"2048"},
{name:"贪吃蛇",type:"动作",stars:2,desc:"经典重制，越吃越长",icon:"🐍",folder:"02-snake",color:"#4caf50",id:"snake"},
{name:"俄罗斯方块",type:"益智",stars:3,desc:"永恒经典，消行大作战",icon:"🧱",folder:"03-tetris",color:"#9c27b0",id:"tetris"},
{name:"像素飞鸟",type:"动作",stars:1,desc:"一键操作，极限穿越",icon:"🐦",folder:"04-flappy-bird",color:"#ff9800",id:"flappy"},
{name:"打砖块",type:"动作",stars:2,desc:"弹球反弹，击碎一切",icon:"🧱",folder:"05-breakout",color:"#f44336",id:"breakout"},
{name:"宝石消消乐",type:"益智",stars:4,desc:"三消连锁，宝石风暴",icon:"💎",folder:"06-match3",color:"#e91e63",id:"match3"},
{name:"扫雷",type:"益智",stars:3,desc:"逻辑推理，步步惊心",icon:"💣",folder:"07-minesweeper",color:"#607d8b",id:"minesweeper"},
{name:"记忆翻牌",type:"益智",stars:1,desc:"翻牌配对，考验记忆",icon:"🃏",folder:"08-memory-cards",color:"#00bcd4",id:"memory"},
{name:"涂鸦跳跃",type:"动作",stars:3,desc:"无尽攀登，永不止步",icon:"⬆️",folder:"09-doodle-jump",color:"#8bc34a",id:"doodle"},
{name:"五子棋",type:"策略",stars:4,desc:"人机对战，策略博弈",icon:"⚫",folder:"10-gomoku",color:"#795548",id:"gomoku"}];
var TYPE_BADGE={"益智":"badge-puzzle","动作":"badge-action","策略":"badge-strategy"};
function renderStars(n){var h="";for(var i=0;i<5;i++){h+='<span class="'+(i<n?"star-filled":"star-empty")+'">★</span>'}return h}
// 返回 [标签, 值]: 扫雷/记忆翻牌/五子棋的存档不是 game_{id}_highscore, 各自按真实格式读
function getHS(id){try{var L=localStorage,i,v;if(id==="minesweeper"){var ms=[["hard","高级"],["medium","中级"],["easy","初级"]];for(i=0;i<ms.length;i++){v=L.getItem("game_minesweeper_best_"+ms[i][0]);if(v!==null)return["最佳",ms[i][1]+" "+v+"秒"]}return["最佳","--"]}if(id==="memory"){var mm=[["6x6","专家"],["6x4","困难"],["4x4","普通"],["4x3","简单"]];for(i=0;i<mm.length;i++){v=L.getItem("game_memory_best_"+mm[i][0]);if(v){v=JSON.parse(v);return["最佳",mm[i][1]+" "+v.moves+"步"]}}return["最佳","--"]}if(id==="gomoku"){v=L.getItem("game_gomoku_stats");if(v){v=JSON.parse(v);return["战绩","胜"+v.w+" 负"+v.l]}return["战绩","--"]}v=L.getItem("game_"+id+"_highscore");return["最高分",v!==null?v:"--"]}catch(e){return["最高分","--"]}}
function rgba(hex,a){return"rgba("+parseInt(hex.slice(1,3),16)+","+parseInt(hex.slice(3,5),16)+","+parseInt(hex.slice(5,7),16)+","+a+")"}
function render(){var g=document.getElementById("game-grid"),h="";for(var i=0;i<GAMES.length;i++){var d=GAMES[i],b=TYPE_BADGE[d.type]||"badge-puzzle",s=getHS(d.id);h+='<a class="game-card" href="'+d.folder+'/index.html" data-index="'+i+'" data-color="'+d.color+'">'+'<div class="card-accent" style="background:linear-gradient(90deg,'+d.color+','+rgba(d.color,0.3)+')"></div>'
+'<div class="card-body"><div class="card-header"><div class="card-icon" style="background:'+rgba(d.color,0.12)+'"><span>'+d.icon+'</span></div>'
+'<div class="card-info"><div class="card-name">'+d.name+'</div><div class="card-meta"><span class="badge '+b+'">'+d.type+'</span><div class="stars">'+renderStars(d.stars)+'</div></div></div></div>'
+'<div class="card-desc">'+d.desc+'</div><div class="card-footer"><div class="highscore">🏆 '+s[0]+': <span class="highscore-val" id="score-'+d.id+'">'+s[1]+'</span></div>'
+'<div class="play-hint" style="color:'+d.color+'">开始游戏 <span class="arrow">→</span></div></div></div></a>'}g.innerHTML=h;
var cards=document.querySelectorAll(".game-card");for(var i=0;i<cards.length;i++){(function(c){var col=c.getAttribute("data-color");c.addEventListener("mouseenter",function(){c.style.boxShadow="0 20px 50px "+rgba(col,0.25)+", 0 0 0 1px "+rgba(col,0.15)});c.addEventListener("mouseleave",function(){c.style.boxShadow="none"})})(cards[i])}}render();
(function(){var cards=document.querySelectorAll(".game-card");if("IntersectionObserver" in window){var obs=new IntersectionObserver(function(entries){for(var i=0;i<entries.length;i++){if(entries[i].isIntersecting){var card=entries[i].target,delay=parseInt(card.getAttribute("data-index"),10)*100;(function(c,d){setTimeout(function(){c.classList.add("visible")},d)})(card,delay);obs.unobserve(card)}}},{threshold:0.05});for(var j=0;j<cards.length;j++)obs.observe(cards[j])}else{for(var k=0;k<cards.length;k++)cards[k].classList.add("visible")}})();
(function(){var canvas=document.getElementById("particle-canvas"),ctx=canvas.getContext("2d");var particles=[],N=55,CD=140,MD=180,mx=-9999,my=-9999;function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}resize();window.addEventListener("resize",resize);document.addEventListener("mousemove",function(e){mx=e.clientX;my=e.clientY});document.addEventListener("mouseleave",function(){mx=-9999;my=-9999});function Particle(){this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;this.vx=(Math.random()-0.5)*0.4;this.vy=(Math.random()-0.5)*0.4;this.r=Math.random()*1.8+0.8;this.o=Math.random()*0.4+0.15}for(var i=0;i<N;i++)particles.push(new Particle());function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);for(var i=0;i<particles.length;i++){var p=particles[i];p.x+=p.vx;p.y+=p.vy;if(p.x<-10)p.x=canvas.width+10;if(p.x>canvas.width+10)p.x=-10;if(p.y<-10)p.y=canvas.height+10;if(p.y>canvas.height+10)p.y=-10;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,"+p.o+")";ctx.fill()}for(var i=0;i<particles.length;i++){for(var j=i+1;j<particles.length;j++){var dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<CD){var a=(1-dist/CD)*0.15;ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle="rgba(130,150,255,"+a+")";ctx.lineWidth=0.6;ctx.stroke()}}}for(var i=0;i<particles.length;i++){var dx=particles[i].x-mx,dy=particles[i].y-my,dist=Math.sqrt(dx*dx+dy*dy);if(dist<MD){var a=(1-dist/MD)*0.25;ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(mx,my);ctx.strokeStyle="rgba(160,140,255,"+a+")";ctx.lineWidth=0.8;ctx.stroke()}}requestAnimationFrame(loop)}loop()})();
</script>
</body>
</html>
